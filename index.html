<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>VOCA 1800 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&display=swap">
<style>
  /* Layout: one narrow column, phone first. Setup -> flashcard preview -> mixed quiz -> graded result. */
  :root {
    --bg: #EEF1F7;
    --surface: #FFFFFF;
    --surface-2: #F4F6FB;
    --ink: #111A33;
    --muted: #59647F;
    --line: #D6DCEA;
    --accent: #2D4BD6;
    --accent-ink: #FFFFFF;
    --accent-soft: #E2E8FC;
    --good: #0E7C57;
    --good-soft: #DAF1E7;
    --bad: #C23A2E;
    --bad-soft: #FADFDB;
    --mark: #D23A2E;
    --shadow: 0 1px 0 rgba(17,26,51,.04), 0 10px 26px -14px rgba(17,26,51,.28);
    --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    --font-display: "Newsreader", Georgia, "Times New Roman", serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1222; --surface: #161D33; --surface-2: #1C2540; --ink: #E9EDF8; --muted: #9AA5C4;
      --line: #2B3555; --accent: #8EA3FF; --accent-ink: #0D1222; --accent-soft: #232E5A;
      --good: #52D3A2; --good-soft: #13392E; --bad: #FF8F84; --bad-soft: #44201D; --mark: #FF8F84;
      --shadow: 0 10px 26px -14px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D1222; --surface: #161D33; --surface-2: #1C2540; --ink: #E9EDF8; --muted: #9AA5C4;
    --line: #2B3555; --accent: #8EA3FF; --accent-ink: #0D1222; --accent-soft: #232E5A;
    --good: #52D3A2; --good-soft: #13392E; --bad: #FF8F84; --bad-soft: #44201D; --mark: #FF8F84;
    --shadow: 0 10px 26px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 400 15px/1.55 var(--font-body);
    padding-block: 20px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1, h2, p, ul { margin: 0; padding: 0; }
  ul { list-style: none; }
  button { font-family: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, .fc:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .shell { max-width: 520px; margin: 0 auto; }
  .view { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Setup */
  .mast { display: flex; flex-direction: column; gap: 10px; padding: 8px 0 4px; }
  .eyebrow { font: 500 11px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  h1 { font: 600 clamp(46px, 14vw, 62px)/.95 var(--font-display); letter-spacing: -.02em; }
  h1 em { font-style: italic; font-weight: 500; color: var(--accent); }
  .lede { color: var(--muted); max-width: 34em; text-wrap: balance; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .label { font: 600 12px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 8px 14px; min-height: 40px; font: 500 13px var(--font-mono); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .range-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .range-row label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  select { min-height: 40px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 10px; padding: 0 10px; font: 500 14px var(--font-mono); }
  .meta { font: 500 12px var(--font-mono); color: var(--muted); letter-spacing: .04em; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg button { min-height: 46px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; font: 500 15px var(--font-mono); cursor: pointer; }
  .seg button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .mixbar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; gap: 2px; }
  .mixbar i { display: block; background: var(--accent); }
  .mixbar i:nth-child(2) { opacity: .55; }
  .mixbar i:nth-child(3) { opacity: .28; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
  .legend b { font: 500 13px var(--font-mono); color: var(--ink); margin-left: 4px; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .btn { min-height: 50px; width: 100%; border-radius: 12px; border: 1px solid transparent; padding: 0 18px; font: 600 15px var(--font-body); cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.secondary { background: var(--surface); border-color: var(--line); }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.outline { background: var(--surface); border: 1.5px solid var(--accent); color: var(--accent); }
  .btn.big { min-height: 68px; border-radius: 16px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; text-align: left; padding: 0 20px; box-shadow: var(--shadow); }
  .btn.big span { font: 600 18px/1.2 var(--font-body); }
  .btn.big small { font: 400 12.5px/1.3 var(--font-body); opacity: .8; }

  /* Top bar, progress */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .link { background: none; border: 0; color: var(--muted); font: 500 13px var(--font-body); padding: 8px 4px; min-height: 40px; cursor: pointer; }
  .bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
  .tally { display: flex; align-items: center; gap: 6px; font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; }
  .tally .o { color: var(--good); font-weight: 500; }
  .tally .x { color: var(--bad); font-weight: 500; margin-left: 6px; }

  /* Flashcard */
  .fc-wrap { perspective: 1200px; }
  .fc { position: relative; width: 100%; height: clamp(320px, 54vh, 400px); transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2,.7,.2,1); cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; border-radius: 20px; }
  .fc.noanim { transition: none; }
  .fc.flipped { transform: rotateY(180deg); }
  .fc-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .fc-back { transform: rotateY(180deg); overflow-y: auto; }
  .fc-meta { display: flex; align-items: center; justify-content: space-between; min-height: 32px; }
  .fc-front { align-items: stretch; }
  .fc-word { margin: auto 0; text-align: center; font: 600 54px/1.05 var(--font-display); letter-spacing: -.01em; overflow-wrap: anywhere; }
  .fc-hint { text-align: center; font-size: 12px; color: var(--muted); }
  .fc-word-sm { font: 600 22px/1.2 var(--font-display); color: var(--accent); }
  .fc-mean { font: 500 22px/1.45 var(--font-body); }
  .fc-ex { font: italic 500 17px/1.5 var(--font-display); color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin-top: auto; }
  .fc-ex mark { background: var(--accent-soft); color: var(--accent); font-style: normal; font-weight: 600; padding: 0 3px; border-radius: 4px; }
  .mark-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .nav-row { display: flex; justify-content: space-between; }
  .link:disabled { opacity: .35; cursor: default; }
  .endcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .endcard h2 { font: 600 28px/1.15 var(--font-display); }
  .stats { display: flex; gap: 20px; font: 500 14px var(--font-mono); color: var(--muted); }
  .stats b { color: var(--ink); font-weight: 500; margin-left: 4px; }

  /* Quiz */
  .qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); min-width: 0; }
  .qmeta { display: flex; justify-content: space-between; align-items: center; }
  .tag { font: 500 11px/1 var(--font-mono); letter-spacing: .08em; padding: 6px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); }
  .q-prompt { font-size: 13px; color: var(--muted); }
  .q-word { font: 600 44px/1.08 var(--font-display); letter-spacing: -.01em; overflow-wrap: anywhere; }
  .q-mean { font: 500 22px/1.45 var(--font-body); }
  .q-sent { font: 500 21px/1.55 var(--font-display); }
  .q-sent .blank { display: inline-block; min-width: 4.2em; border-bottom: 2px solid var(--ink); text-align: center; color: var(--accent); font-weight: 600; margin: 0 2px; }
  .hint { font: 500 15px var(--font-mono); letter-spacing: .12em; color: var(--muted); overflow-wrap: anywhere; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; min-height: 54px; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: 500 15px/1.4 var(--font-body); cursor: pointer; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { color: var(--ink); cursor: default; }
  .bub { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font: 500 12px var(--font-mono); color: var(--muted); }
  .opt.picked .bub { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .opt.is-correct { background: var(--good-soft); border-color: var(--good); }
  .opt.is-correct .bub { background: var(--good); border-color: var(--good); color: var(--bg); }
  .opt.is-wrong { background: var(--bad-soft); border-color: var(--bad); }
  .opt.is-wrong .bub { background: var(--bad); border-color: var(--bad); color: var(--bg); }
  .opt.dim { opacity: .62; }
  .opt-r { display: flex; align-items: center; gap: 8px; max-width: 190px; }
  .opt-w { font: 500 12px/1.3 var(--font-mono); color: var(--muted); text-align: right; overflow-wrap: anywhere; }
  .mk { display: inline-grid; place-items: center; }
  .mk svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
  .mk.good { color: var(--good); }
  .mk.bad { color: var(--bad); }
  .sp-form { display: flex; flex-direction: column; gap: 10px; }
  .inp { width: 100%; min-height: 54px; font: 500 24px var(--font-display); letter-spacing: .02em; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 14px; background: var(--surface-2); color: var(--ink); }
  .inp:disabled { color: var(--ink); opacity: 1; -webkit-text-fill-color: var(--ink); }
  .sp-actions { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; }
  .fb { display: flex; gap: 12px; align-items: flex-start; border-radius: 12px; padding: 12px 14px; }
  .fb.good { background: var(--good-soft); }
  .fb.bad { background: var(--bad-soft); }
  .fb .mk svg { width: 30px; height: 30px; }
  .fb-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .fb-t { font-weight: 600; }
  .fb-w { font: 600 22px/1.2 var(--font-display); overflow-wrap: anywhere; }
  .fb-m { font-size: 14px; color: var(--ink); }
  .fb-s { font: italic 500 16px/1.5 var(--font-display); }
  .fb-s b { font-style: normal; font-weight: 600; }
  .fb-given { font-size: 13px; color: var(--muted); }

  /* Result */
  .score-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 4px; }
  .score { position: relative; display: inline-flex; align-items: baseline; gap: 8px; padding: 20px 38px; }
  .score svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .score svg ellipse { fill: none; stroke: var(--mark); stroke-width: 3.5; vector-effect: non-scaling-stroke; stroke-linecap: round; }
  .sc-n { font: 600 72px/1 var(--font-display); letter-spacing: -.02em; position: relative; }
  .sc-d { font: 500 24px var(--font-display); color: var(--muted); position: relative; }
  .pct { font: 500 13px var(--font-mono); color: var(--muted); letter-spacing: .08em; }
  .msg { text-align: center; color: var(--muted); text-wrap: balance; }
  .brk { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
  .brk .track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .brk .track i { display: block; height: 100%; background: var(--accent); }
  .brk .n { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; }
  .wl li { display: grid; gap: 2px; padding: 12px 0; border-top: 1px solid var(--line); }
  .wl li:first-child { border-top: 0; padding-top: 0; }
  .wl .w { font: 600 22px/1.2 var(--font-display); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .wl .w .mono { font-size: 11px; }
  .wl .m { font-size: 14px; }
  .wl .g { font-size: 13px; color: var(--muted); }

  .badge { font: 500 11px/1 var(--font-mono); padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); letter-spacing: .04em; }
  .badge.cnt { color: var(--bad); border-color: var(--bad); }
  .badge.ok { color: var(--good); border-color: var(--good); }
  .empty { color: var(--muted); font-size: 14px; }
  @media (prefers-reduced-motion: reduce) {
    .fc, .bar i { transition: none; }
  }
</style>

</head>
<body>
<main class="shell">

  <!-- 1. Setup -->
  <section id="v-setup" class="view">
    <header class="mast">
      <p class="eyebrow">영어 못하는 사람 다 들어와 · 입시 단어</p>
      <h1>VOCA <em>1800</em></h1>
      <p class="lede">범위를 고르면 단어를 뽑아 플래시카드로 먼저 훑고, 혼합형 퀴즈로 확인해요.</p>
    </header>
    <div class="panel">
      <h2 class="label">범위</h2>
      <div class="chips" id="chips"></div>
      <div class="range-row">
        <label for="d-from">시작 <select id="d-from"></select></label>
        <span class="mono">~</span>
        <label for="d-to">끝 <select id="d-to"></select></label>
      </div>
      <p class="meta" id="range-meta"></p>
    </div>
    <div class="panel">
      <h2 class="label">문항 수</h2>
      <div class="seg" id="seg-n" role="radiogroup" aria-label="문항 수"></div>
      <div class="mixbar" id="mixbar"></div>
      <div class="legend" id="legend"></div>
      <p class="meta" id="mix-note"></p>
    </div>
    <div class="actions">
      <button class="btn primary big" id="go-cards" type="button"><span>플래시카드</span></button>
      <button class="btn outline big" id="go-quiz" type="button"><span>퀴즈 풀기</span></button>
      <button class="btn secondary" id="go-wrong" type="button">최근 오답 보기</button>
    </div>
  </section>

  <!-- 2. Flashcards -->
  <section id="v-cards" class="view" hidden>
    <div class="topbar">
      <button class="link" id="c-back" type="button">← 설정</button>
      <span class="mono" id="c-count"></span>
      <button class="link" id="c-skip" type="button">퀴즈로 →</button>
    </div>
    <div class="bar"><i id="c-bar"></i></div>
    <div id="c-deck" class="view">
      <div class="fc-wrap">
        <div class="fc" id="fc" role="button" tabindex="0" aria-label="카드 뒤집기">
          <div class="fc-face fc-front">
            <div class="fc-meta">
              <span class="mono" id="fc-day"></span>
            </div>
            <div class="fc-word" id="fc-word"></div>
            <p class="fc-hint">탭하거나 휙 넘기면 뒤집혀요</p>
          </div>
          <div class="fc-face fc-back">
            <div class="fc-meta"><span class="mono" id="fc-day2"></span></div>
            <p class="fc-word-sm" id="fc-word2"></p>
            <p class="fc-mean" id="fc-mean"></p>
            <p class="fc-ex" id="fc-ex"></p>
          </div>
        </div>
      </div>
      <div class="mark-row">
        <button class="btn secondary" id="c-unsure" type="button">헷갈려요</button>
        <button class="btn primary" id="c-know" type="button">알아요</button>
      </div>
      <div class="nav-row">
        <button class="link" id="c-prev" type="button">← 이전</button>
        <button class="link" id="c-flip" type="button">뒤집기</button>
        <button class="link" id="c-next" type="button">다음 →</button>
      </div>
    </div>
    <div id="c-end" class="endcard" hidden></div>
  </section>

  <!-- 3. Quiz -->
  <section id="v-quiz" class="view" hidden>
    <div class="topbar">
      <button class="link" id="q-quit" type="button">← 그만하기</button>
      <span class="mono" id="q-count"></span>
      <span class="tally" aria-label="채점 현황"><span class="o">○</span><span id="q-ok">0</span><span class="x">／</span><span id="q-ng">0</span></span>
    </div>
    <div class="bar"><i id="q-bar"></i></div>
    <article class="qcard">
      <div class="qmeta"><span class="tag" id="q-type"></span><span class="mono" id="q-no"></span></div>
      <div id="q-body" class="view"></div>
      <div id="q-fb" class="fb" role="status" hidden></div>
      <button class="btn primary" id="q-next" type="button" hidden>다음 문제</button>
    </article>
  </section>

  <!-- 5. Recent wrong answers -->
  <section id="v-wrong" class="view" hidden></section>

  <!-- 4. Result -->
  <section id="v-result" class="view" hidden></section>

</main>

<script>

    }
    var acts = h('div', { class: 'actions' },
      h('button', { class: 'btn primary', type: 'button', disabled: !words.length,
        onclick: function () { openCards(words, function () { startWrongQuiz(words); }); } }, '아직 틀린 단어 카드로 복습'),
      h('button', { class: 'btn secondary', type: 'button', disabled: !words.length,
        onclick: function () { startWrongQuiz(words); } }, '아직 틀린 단어로 퀴즈'));
    var ul = h('ul', { class: 'wl' }, all.map(function (e) {
      var r = e.r;
      return h('li', null,
        h('div', { class: 'w' }, e.wd.w,
          h('span', { class: 'badge cnt' }, '×' + r.c),
          r.r ? h('span', { class: 'badge ok' }, '다시 맞힘') : null,
          h('span', { class: 'mono' }, 'DAY ' + String(e.wd.day).padStart(2, '0'))),
        h('div', { class: 'm' }, e.wd.m),
        h('div', { class: 'g' }, fmtTime(r.t) + ' · ' + TYPE_SHORT[r.ty] + ' · 내 답: ' + (r.g || '모르겠어요')));
    }));
    var clear = h('button', { class: 'btn ghost', type: 'button' }, '기록 지우기');
    clear.addEventListener('click', function () {
      if (clearTimer) { clearTimeout(clearTimer); clearTimer = null; LOG = {}; saveLog(); renderWrong(); return; }
      clear.textContent = '한 번 더 누르면 전부 지워져요';
      clearTimer = setTimeout(function () { clearTimer = null; clear.textContent = '기록 지우기'; }, 3000);
    });
    root.append(acts, h('div', { class: 'panel' }, h('h2', { class: 'label' }, '최근 순'), ul), clear);
  }

  /* keyboard */
  function isBtn(t) { return t && (t.tagName === 'BUTTON' || t.tagName === 'SELECT'); }
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (current === 'v-cards') {
      if (e.key === 'ArrowRight') { e.preventDefault(); if (!$('#c-deck').hidden) nextCard(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); if (!$('#c-deck').hidden) prevCard(); }
    } else if (current === 'v-quiz') {
      var t = e.target;
      if (!Q.answered && Q.cur && Q.cur.type !== 'sp' && /^[1-5]$/.test(e.key)) { pickOpt(+e.key - 1); }
      else if (Q.answered && e.key === 'Enter' && !isBtn(t)) { e.preventDefault(); nextQ(); }
    }
  });

  renderSetup();
})();
</script>

</body>
</html>
